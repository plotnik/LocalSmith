[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["collector", "export_log"]

[project]
name = "localsmith"
version = "0.1.0"
description = "Local tracing for LangGraph and LangChain with Markdown and HTML exports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
localsmith-export = "export_log:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "langsmith>=0.3,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
